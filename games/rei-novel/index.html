<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#070b1d; color:#e8ecf8; font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; display:flex; justify-content:center; min-height:100vh; }
  #app { width:100%; max-width:480px; padding:16px 14px 28px; }
  header { text-align:center; margin:6px 0 12px; }
  header .brand { color:#d8b23c; letter-spacing:.35em; font-size:11px; }

  header .sub { color:#8fa0d0; font-size:12px; margin-top:2px; }
  #meter { display:flex; align-items:center; gap:8px; margin:10px 0 14px; font-size:12px; color:#c8d2f0; }

  #stage img { width:100%; display:block; }
  #sceneName { position:absolute; top:10px; left:10px; background:rgba(7,11,29,.75); padding:4px 10px; border-radius:999px; font-size:12px; color:#ffd9a0; }

  #who { color:#ffa033; font-weight:bold; font-size:14px; margin-bottom:6px; }
  #text { font-size:15px; line-height:1.75; white-space:pre-wrap; }
  #choices { margin-top:14px; display:grid; gap:10px; }
  button.choice { background:#1b2650; color:#e8ecf8; border:1px solid #3a4a8f; border-radius:12px; padding:13px 14px; font-size:15px; text-align:left; cursor:pointer; }
  button.choice:active { background:#2a3a75; }
  #next { margin-top:14px; width:100%; background:#d8b23c; color:#141414; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:bold; cursor:pointer; }
  #ending { display:none; text-align:center; background:#101838; border:1px solid #d8b23c; border-radius:14px; padding:22px 16px; margin-top:14px; }
  #ending h2 { color:#ffd9a0; font-size:19px; margin-bottom:10px; }
  #ending p { font-size:14px; line-height:1.8; }
  #again { margin-top:16px; background:#1b2650; color:#e8ecf8; border:1px solid #3a4a8f; border-radius:12px; padding:11px 22px; font-size:14px; cursor:pointer; }
  footer { text-align:center; color:#5f6f9f; font-size:11px; margin-top:18px; }

<script>
const scenes = [
  { scene:"AKUMUオフィス・夜", who:"レイ",
    text:"「…まだ残ってたの。ちょうど今週の数字をまとめてたところ。」\nモニターの光の中で、レイが少しだけこちらを見た。",
    choices:[
      { label:"「お疲れさま。コーヒー、淹れてきたよ」", pts:2, reply:"「……ありがとう。そういうの、ずるいよね。」\n彼女はカップを受け取って、小さく笑った。" },
      { label:"「数字どうだった？」とすぐ聞く", pts:1, reply:"「先週より、少しだけ上。…悪くない数字。」\n淡々と答えるけど、どこか誇らしげだった。" },
      { label:"「もう帰れば？」と素っ気なく言う", pts:0, reply:"「…社長が帰らないのに、帰れるわけないでしょ。」\nふい、と視線をモニターに戻された。" }
    ]},
  { scene:"オフィスの窓辺", who:"レイ",
    text:"「ねえ、なんで私を記録係に選んだの？」\n夜景を見ながら、レイがぽつりと聞いてきた。",
    choices:[
      { label:"「レイの数字は、嘘をつかないから」", pts:2, reply:"「……ふふ。じゃあ私も、嘘のない数字を出し続ける。」\n窓ガラスに映る彼女は、少しだけ頬を染めていた。" },
      { label:"「なんとなく、合いそうだったから」", pts:1, reply:"「なんとなく、か。…まあ、嫌いじゃないけど、その理由。」" },
      { label:"「他にいなかったし」", pts:0, reply:"「……そう。…分かってたけど、言葉にされると少し来るね。」\n静かに夜景へ視線を戻した。" }
    ]},
  { scene:"帰り道・ひだまりカフェの前", who:"レイ",
    text:"雨上がりの通り。カフェの明かりに、レイが足を止めた。\n「……少しだけ、寄ってく？ 私、こういうの誘うの、慣れてなくて。」",
    choices:[
      { label:"「もちろん。今日はレイのおごり禁止な」", pts:2, reply:"「…っ、ずるい。先に言うなんて。」\n耳まで赤くして、でも嬉しそうにドアを開けた。" },
      { label:"「今日はもう遅いし、また今度」", pts:1, reply:"「…うん、そうだね。また今度。」\n小さく頷いた声は、いつもより少しだけ小さかった。" },
      { label:"無言で先に歩き出す", pts:0, reply:"「……あ、うん。…そうだよね。」\nカフェの明かりが、後ろで遠くなっていく。" }
    ]}
];
const endings = [
  { min:6, title:"エンディング：月明かりの約束", text:"カフェを出る頃、雨上がりの空には月が出ていた。\n「……今日の記録、私のメモにも残しておく。消さないやつに。」\nレイはそう言って、ほんの少しだけ笑った。\n――二人の距離は、確かに近づいている。" },
  { min:3, title:"エンディング：静かな信頼", text:"「おつかれさま。……また明日、数字の続き、見せてあげる。」\n劇的じゃない。でも、確かな信頼がそこにあった。\n悪くない。これがAKUMUの歩幅だ。" },
  { min:0, title:"エンディング：記録係の忠告", text:"「……今日の会話、全部メモしといた。反省材料として。」\n冷たい声。でも、それもレイなりの距離の測り方。\n次はもう少し、上手くやろう。" }
];
let step = 0, score = 1;
const $ = id => document.getElementById(id);
function renderScore(){ $("score").textContent = score; $("bar").style.width = Math.min(100, score/6*100) + "%"; }
function showScene(){
  const s = scenes[step];
  $("sceneName").textContent = s.scene;
  $("who").textContent = s.who;
  $("text").textContent = s.text;
  $("next").style.display = "none";
  const box = $("choices"); box.innerHTML = "";
  s.choices.forEach(c => {
    const b = document.createElement("button");
    b.className = "choice"; b.textContent = c.label;
    b.onclick = () => {
      score += c.pts; renderScore();
      $("text").textContent = c.reply;
      box.innerHTML = "";
      $("next").style.display = "block";
    };
    box.appendChild(b);
  });
}
$("next").onclick = () => {
  step++;
  if (step < scenes.length) { showScene(); return; }
  const e = endings.find(e => score >= e.min);
  $("box").style.display = "none"; $("next").style.display = "none"; $("choices").innerHTML = "";
  $("endTitle").textContent = e.title; $("endText").textContent = e.text;
  $("ending").style.display = "block";
};
$("again").onclick = () => location.reload();
renderScore(); showScene();
</script>
